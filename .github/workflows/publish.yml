# Rebuilds the player-rankings page from the NHL API and publishes it to GitHub Pages.
#
# When it runs (GitHub's clock is UTC; Dallas is UTC-5 in season, UTC-6 from November to March):
#   - every night at 08:43 UTC (3:43 am Central in daylight time, 2:43 am in standard time)
#   - every 30 minutes from 02:17 to 06:47 UTC, so a finished game shows up the same night
#   Odd minutes on purpose: GitHub delays or drops scheduled runs when it's busy, worst at :00 and :30.
#   In Sep-Oct 2026, with the times on :00/:30, only about 2 of the 11 daily runs happened, hours late.
#   - whenever you press "Run workflow" on the Actions tab
#
# If anything fails (NHL API down, a data change, a failed test), nothing is published:
# the last good page stays live and GitHub emails you that the run failed.
#
# After a game is published, the last job emails the post-game notes (noteworthy stats + "No Filter"),
# once per game, after the publish that has the game's final stats (official, on-ice numbers in). See tools/postgame_email.py. Claude runs as Claude Code
# on the owner's Claude subscription (no paid API key). It needs these repo secrets: CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`), SMTP_USER, SMTP_PASSWORD, and optionally EMAIL_TO. Until they're set,
# it skips quietly.
name: Publish player rankings

on:
  schedule:
    - cron: "43 8 * * *"
    - cron: "17,47 2-6 * * *"
  workflow_dispatch:
    inputs:
      resend_postgame_email:
        description: "Email the latest game's post-game notes now, even if they were already sent"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # only for the keep-alive step at the end

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # pinned so GitHub's switch to a newer Ubuntu (from Oct 19, 2026) can't break the browser install mid-season
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium webkit   # webkit = Safari's engine (iPhones)

      # Finished games never change, so keep the downloaded NHL data between runs.
      # Each run saves a fresh copy; the newest one is restored next time.
      - name: Restore NHL data
        uses: actions/cache@v6
        with:
          path: .nhl_cache
          key: nhl-cache-${{ github.run_id }}
          restore-keys: nhl-cache-

      - name: Test the code (offline, on the fake sample season)
        run: python -m pytest -q

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the page from the live NHL API
        env:
          CREDIT: ${{ vars.CREDIT }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python build_dashboard.py --credit "$CREDIT" --site-url "$SITE_URL/" --out _site/index.html
          python tools/make_share_image.py _site/index.html _site/og-image.png

      - name: Smoke-test the real page
        run: python -m pytest -q tests/test_browser.py --page _site/index.html -k "loads_and_draws or player_card or share_game or share_player or safari"

      - name: Pull the latest game's numbers for the post-game email
        run: python tools/postgame_email.py brief _site/index.html --out postgame/brief.json

      - uses: actions/upload-artifact@v7
        with:
          name: postgame-brief
          path: postgame/brief.json
          retention-days: 3

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04   # same machine type as the build, for the same reason
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # GitHub pauses scheduled workflows in repos with no activity for 60 days.
      # Re-enabling the workflow through the API counts as activity and keeps the schedule alive.
      - name: Keep the nightly schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"

  # Runs after every publish but only sends once per game (the list of games already emailed is kept in
  # the Actions cache). If it fails, the page is already live; GitHub emails you and the next run retries.
  postgame-email:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          npm install -g @anthropic-ai/claude-code

      - uses: actions/download-artifact@v8
        with:
          name: postgame-brief
          path: postgame

      - name: Restore the list of games already emailed
        uses: actions/cache/restore@v6
        with:
          path: .postgame_state
          key: postgame-sent-${{ github.run_id }}
          restore-keys: postgame-sent-

      - id: email
        name: Write and send the post-game email (if it's due)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE: ${{ inputs.resend_postgame_email && '--force' || '' }}
        run: python tools/postgame_email.py send postgame/brief.json $FORCE

      - name: Remember that this game was emailed
        if: steps.email.outputs.sent == 'true'
        uses: actions/cache/save@v6
        with:
          path: .postgame_state
          key: postgame-sent-${{ github.run_id }}

      # a copy of what was written, on the run's page under Artifacts, in case the email goes astray
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('postgame/email.html') != ''
        with:
          name: postgame-email
          path: postgame/email.*
          retention-days: 30
