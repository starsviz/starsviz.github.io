# Publishes the site as soon as a Stars game's stats are final (tools/site_check.py).
#
# cron-job.org starts this every 5 minutes (a POST to /repos/starsviz/starsviz.github.io/actions/workflows/
# site-check.yml/dispatches with {"ref": "main"}, the same token as the picks job), because GitHub's own schedule is
# hours late or skipped on this repo. Most runs find nothing to do. When the latest game is official with every
# on-ice number in and isn't on the site yet, it starts "Publish player rankings", which rebuilds the page and then
# sends the post-game email. The builder holds back a game whose stats aren't final, so nothing goes up early.
name: Check for a finished game

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # to start the publish workflow
  pages: read      # to look up the site's address

concurrency:
  group: site-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - id: check
        name: Is a finished game ready to go up?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow publish.yml --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != "0" ]; then echo "A publish is already running; checking again next time."; exit 0; fi
          python tools/site_check.py --site "$(gh api "repos/$GITHUB_REPOSITORY/pages" -q .html_url)"

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref main
