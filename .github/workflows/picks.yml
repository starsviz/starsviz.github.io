# The team score picks (tools/daily_picks.py): every morning after 6 am Central it grades last night's games and
# resets the rule; 2 hours before the day's first game it picks every game and emails the owner the picks that fit
# the rule, the rule, every game, and the spreadsheet.
#
# When it runs: cron-job.org starts it every 15 minutes through GitHub's API (a POST to
# /repos/starsviz/starsviz.github.io/actions/workflows/picks.yml/dispatches with {"ref": "main"}, using a
# fine-grained token limited to this repo's Actions), because GitHub's own schedule is hours late or skipped on this
# repo (see publish.yml). Each run does only what's due, so extra runs are harmless; the hourly schedule below is
# only a backup in case cron-job.org stops.
#
# Its data lives on the picks-data branch, never on main: the site isn't touched, and saving there doesn't publish.
# Email: the post-game email's secrets (SMTP_USER, SMTP_PASSWORD, optional EMAIL_TO). Without them it skips sending.
name: Team score picks

on:
  workflow_dispatch:
    inputs:
      send_now:
        description: "Pick today's games and send the email now, even if it already went out today"
        type: boolean
        default: false
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write   # to save the data on the picks-data branch

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: picks-data
          path: picks-data

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Do whatever is due
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SEND_NOW: ${{ inputs.send_now && '--send-now' || '' }}
        run: python tools/daily_picks.py run --data picks-data $SEND_NOW

      - name: Save the data
        working-directory: picks-data
        run: |
          rm -f email.html email.txt
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Picks data, $(TZ=America/Chicago date '+%Y-%m-%d %H:%M') CT"
          git push -q origin HEAD:picks-data
