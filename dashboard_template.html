<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__DASHBOARD_TITLE__</title>
<meta name="description" content="__DASHBOARD_DESCRIPTION__">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131b1f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,__DASHBOARD_FAVICON__">
<!--share-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a story feed. Each view opens with a headline written from the data, then "chapters": one point, one chart, one caption. Stat tables sit collapsed at the end. */
:root {
  --bg: #eaf0f2;
  --surface: #ffffff;
  --surface-2: #f3f7f8;
  --ink: #0e171b;
  --ink-2: #41515a;
  --muted: #6b7b83;
  --line: #d9e2e6;
  --rink: #c9d5da;
  --ice: #fbfdfd;
  --slot: #e6f2ec;
  --accent: #00754a;
  --accent-soft: #dff0e7;
  --opp: #88949a;
  --opp-soft: #e8edef;
  --otl: #c3cdd1;
  --hot: #b4481b;
  --hot-soft: #fbe9e0;
  --cold: #2c6fa8;
  --cold-soft: #e3eef8;
  --defc: #2a78d6;
  --good: #13733c;
  --good-soft: #dcf1e3;
  --bad: #b42318;
  --bad-soft: #fbe4e1;
  --tip-bg: #0e171b;
  --tip-fg: #f2f6f7;
  --shadow: 0 1px 2px rgba(14, 23, 27, .06), 0 4px 16px rgba(14, 23, 27, .05);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1114; --surface: #131b1f; --surface-2: #182227; --ink: #e8eff1; --ink-2: #a7b6bd; --muted: #7b8a91;
    --line: #243038; --rink: #34444c; --ice: #151e22; --slot: #17302a; --accent: #20a36b; --accent-soft: #13302a;
    --opp: #5f6a70; --opp-soft: #1d272c; --otl: #37434a; --hot: #ef8a5c; --hot-soft: #3a2218; --cold: #6fb0e8; --cold-soft: #162a3b; --defc: #3987e5; --good: #5cc98f; --good-soft: #15321f; --bad: #f2837a; --bad-soft: #3d1c19;
    --tip-bg: #e8eff1; --tip-fg: #0e171b; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1114; --surface: #131b1f; --surface-2: #182227; --ink: #e8eff1; --ink-2: #a7b6bd; --muted: #7b8a91;
  --line: #243038; --rink: #34444c; --ice: #151e22; --slot: #17302a; --accent: #20a36b; --accent-soft: #13302a;
  --opp: #5f6a70; --opp-soft: #1d272c; --otl: #37434a; --hot: #ef8a5c; --hot-soft: #3a2218; --cold: #6fb0e8; --cold-soft: #162a3b; --defc: #3987e5; --good: #5cc98f; --good-soft: #15321f; --bad: #f2837a; --bad-soft: #3d1c19;
  --tip-bg: #e8eff1; --tip-fg: #0e171b; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, table { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 980px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; align-items: end; gap: 6px 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .01em; margin: 0; line-height: 1; text-transform: uppercase; }
.brand .season { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--muted); letter-spacing: .04em; }
.brand .rec { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--accent); }


main { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: grid; gap: 14px; }
.banner { background: var(--surface-2); border: 1px dashed var(--muted); color: var(--ink-2); border-radius: var(--radius); padding: 8px 12px; font-size: 13px; }
#games { display: grid; gap: 14px; min-width: 0; }

/* ---------- story blocks ---------- */
.lede { padding: 6px 2px 4px; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.headline { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 6.4vw, 46px); line-height: 1.02; letter-spacing: .005em; margin: 0; text-wrap: balance; }
.dek { font-size: 17px; line-height: 1.5; color: var(--ink-2); margin: 10px 0 0; max-width: 64ch; text-wrap: pretty; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.chapter-label { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.1; margin: 0 0 6px; text-wrap: balance; }
.cap { margin: 0 0 12px; color: var(--ink-2); max-width: 66ch; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

details.more { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 16px; }
details.more > summary { cursor: pointer; padding: 13px 0; font-weight: 600; color: var(--ink-2); list-style: none; display: flex; justify-content: space-between; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; font-size: 18px; line-height: 1; color: var(--muted); }
details.more[open] > summary::after { content: "–"; }
details.more[open] { padding-bottom: 14px; }

/* ---------- game picker ---------- */
.picker { display: flex; align-items: center; gap: 8px; min-width: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; scroll-behavior: smooth; padding: 2px 2px 8px; flex: 1; min-width: 0; scrollbar-width: thin; }
.chip { flex: 0 0 auto; display: grid; gap: 1px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 9px 6px; cursor: pointer; min-width: 74px; border-bottom-width: 3px; }
.chip .d { font-size: 11px; color: var(--muted); }
.chip .o { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.1; }
.chip .r { font-size: 11.5px; font-weight: 600; }
.chip.W { border-bottom-color: var(--accent); } .chip.L { border-bottom-color: var(--opp); } .chip.OTL { border-bottom-color: var(--otl); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] .d { color: var(--bg); opacity: .75; }
.step { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16px; }
.step:disabled { opacity: .35; cursor: default; }

/* score strip */
.score-strip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; margin-top: 14px; }
.score-strip .t { display: inline-flex; align-items: center; gap: 7px; }
.score-strip .s { font-size: 30px; }
.score-strip .st { font-family: var(--font-body); font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: 0 0 auto; }
.sw.us { background: var(--accent); } .sw.them { background: var(--opp); }

/* rink */
.rink { width: 100%; height: auto; display: block; touch-action: pan-y; }
.rink .ice { fill: var(--ice); stroke: var(--rink); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.rink .slot { fill: var(--slot); }
.rink .ln { stroke: var(--rink); stroke-width: 1.1; fill: none; vector-effect: non-scaling-stroke; }
.rink .ln.heavy { stroke-width: 2.2; }
.rink .dot { fill: var(--rink); }
.shot { cursor: pointer; }
.shot.us.sog { fill: var(--accent); stroke: var(--surface); stroke-width: .5; }
.shot.them.sog { fill: var(--opp); stroke: var(--surface); stroke-width: .5; }
.shot.us.miss { fill: var(--ice); stroke: var(--accent); stroke-width: .7; }
.shot.them.miss { fill: var(--ice); stroke: var(--opp); stroke-width: .7; }
.shot.us.goal { fill: var(--accent); stroke: var(--ink); stroke-width: .45; }
.shot.them.goal { fill: var(--opp); stroke: var(--ink); stroke-width: .45; }
.shot.hl { stroke: var(--ink); stroke-width: .9; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); align-items: center; margin-top: 8px; }
.legend .k { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { display: block; }
.kbox { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.kbox.us { background: var(--accent); } .kbox.them { background: var(--opp); } .kbox.otl { background: var(--otl); } .kbox.slot { background: var(--slot); border: 1px solid var(--rink); }
.kbox.ref { height: 2px; background: var(--muted); }
/* player comparisons */
.vs { display: grid; gap: 12px; }
.vs-row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 8.6em; gap: 10px; align-items: center; font-size: 13.5px; }
.vs-row .lab { color: var(--ink-2); }
.vs-row .val { text-align: right; font-size: 12.5px; color: var(--muted); }
.vs-row .val b { color: var(--ink); font-size: 15px; }
.track { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; }
.track .fill { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 2px; background: var(--accent); }
.track .fill.below { background: var(--opp); }
.track .avg { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); border-radius: 1px; }
@media (max-width: 480px) { .vs-row { grid-template-columns: 5.2em minmax(0, 1fr) 7.6em; } }

/* tables */
.pill { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; border-radius: 99px; padding: 2px 7px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.pill.W { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.linkish { background: none; border: 0; padding: 0; color: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-align: left; }
.linkish:hover { text-decoration-color: var(--accent); }
/* "opens the player card" cue next to names in the ranking tables */
.linkish.who { display: inline-flex; align-items: center; gap: 6px; }
.go { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: inline-grid; place-items: center; transition: background-color .15s, border-color .15s; }
.go svg { width: 10px; height: 10px; fill: none; stroke: var(--muted); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s, transform .15s; }
tr[data-pid]:hover .go, .linkish.who:focus-visible .go { background: var(--accent-soft); border-color: var(--accent); }
tr[data-pid]:hover .go svg, .linkish.who:focus-visible .go svg { stroke: var(--accent); transform: translateX(1px); }
@media (prefers-reduced-motion: reduce) { .go svg { transition: none; transform: none !important; } }
.tbl-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 7px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
th:first-child, td:first-child { padding-left: 0; }
th.l, td.l { text-align: left; }
td.nm, th.nm { position: sticky; left: 0; background: var(--surface); text-align: left; }
tbody tr[data-pid], tbody tr[data-game] { cursor: pointer; }
tbody tr[data-pid]:hover td, tbody tr[data-game]:hover td { background: var(--surface-2); }
td.hot { font-weight: 700; }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.axis text, .lbl { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.lbl.end { fill: var(--ink); font-weight: 700; font-size: 12px; }
.annot { fill: var(--ink); font-size: 11.5px; font-weight: 600; font-family: var(--font-body); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.grid line { stroke: var(--line); stroke-width: 1; }
.zero { stroke: var(--ink-2); stroke-width: 1; }
.ref { stroke: var(--muted); stroke-width: 1.2; fill: none; }
.pline { stroke: var(--line); stroke-width: 1; }
.ln-us { stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linejoin: round; }
.area-pos { fill: var(--accent); opacity: .2; } .area-neg { fill: var(--opp); opacity: .3; }
.band-hot { fill: var(--hot); opacity: .1; } .band-cold { fill: var(--cold); opacity: .1; }
.dot-faint { fill: var(--otl); }
.bar-us { fill: var(--accent); } .bar-them { fill: var(--opp); }
.cross { stroke: var(--ink-2); stroke-width: 1; }
.hit { fill: transparent; cursor: pointer; }
.col-hl { fill: var(--surface-2); }
.tl-axis { stroke: var(--rink); stroke-width: 2; }
.ev { cursor: pointer; }

.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--tip-bg); color: var(--tip-fg); font-size: 12.5px; line-height: 1.4;
  padding: 7px 9px; border-radius: 7px; max-width: 240px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
.tip .sw { width: 9px; height: 9px; border-radius: 2px; }

/* player sheet */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 17, .45); display: flex; justify-content: center; align-items: flex-start;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) 12px 24px; overflow-y: auto; }
.sheet { background: var(--bg); border-radius: 14px; width: 100%; max-width: 860px; align-content: start; box-shadow: 0 12px 48px rgba(0,0,0,.3); display: grid; gap: 12px; padding: 0 0 16px; }
.sheet-head { background: var(--surface); border-radius: 14px 14px 0 0; border-bottom: 1px solid var(--line); padding: 14px 16px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
.bignum { font-family: var(--font-display); font-weight: 700; font-size: 54px; line-height: .9; color: var(--accent); grid-row: 1 / span 2; min-width: 1.3em; text-align: center; }
.pname { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; margin: 0; }
.pmeta { font-size: 13px; color: var(--muted); grid-column: 2; }
.close { grid-column: 3; grid-row: 1; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 18px; line-height: 1; }
.scope { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; grid-column: 1 / -1; margin-top: 8px; }
.scope select { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.sheet-body { display: grid; gap: 12px; padding: 0 12px; }
.sheet .lede { padding: 4px 4px 0; }
.sheet .headline { font-size: clamp(26px, 5.4vw, 38px); }
@media (max-width: 560px) { .backdrop { padding: 0; } .sheet { border-radius: 0; min-height: 100%; } .sheet-head { border-radius: 0; } .bignum { font-size: 44px; } .pname { font-size: 24px; } }


/* player score */
.dot-f { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.dot-d { fill: var(--defc); stroke: var(--surface); stroke-width: 2; }
.qd.hl { stroke: var(--ink); stroke-width: 2.5; }
.q-good { fill: var(--accent); opacity: .07; } .q-bad { fill: var(--opp); opacity: .12; }
.qline { stroke: var(--ink-2); stroke-width: 1.2; }
.qlab { fill: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; font-family: var(--font-body); }
.axt { fill: var(--ink-2); font-size: 11.5px; font-weight: 600; font-family: var(--font-body); }
.dlab { fill: var(--ink); font-size: 11.5px; font-weight: 600; font-family: var(--font-body); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
/* share image button + dialog */
.sharebtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px 6px 10px; font: 600 13px/1 var(--font-body); letter-spacing: 0; text-transform: none; cursor: pointer; white-space: nowrap; }
.sharebtn svg, .share-actions svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.sharebtn:hover { border-color: var(--accent); }
.score-strip .sharebtn, .scope .sharebtn { margin-left: auto; }
.backdrop.share-bd { z-index: 55; align-items: center; padding: 16px 12px; }
.sharebox { background: var(--surface); color: var(--ink); border-radius: 14px; width: 100%; max-width: 780px; padding: 14px 16px 12px; display: grid; gap: 12px; box-shadow: 0 12px 48px rgba(0,0,0,.35); }
.share-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.share-top h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; }
.share-top .close { grid-column: auto; grid-row: auto; }
.share-opts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.share-prev { aspect-ratio: 16 / 9; width: 100%; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.share-prev img { width: 100%; height: 100%; display: block; }
.share-wait { color: var(--muted); font-size: 14px; padding: 0 16px; text-align: center; }
.share-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.share-actions button { flex: 1 1 120px; min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; }
.share-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.share-actions button:disabled { opacity: .5; cursor: default; }
.share-status { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.3em; }
/* chart zoom: the chart takes two-finger pinches; one finger still scrolls the page */
svg.zoomable { touch-action: pan-y; -webkit-user-select: none; user-select: none; }
/* zoomed in, a finger on the chart moves the chart (the page still scrolls from outside it) */
svg.zoomable.zoomed { touch-action: none; cursor: grab; } svg.zoomable.zoomed:active { cursor: grabbing; }
.zoom .zhint { align-self: center; font-size: 12px; color: var(--muted); margin-right: 4px; }
.zoom { margin-left: auto; display: inline-flex; gap: 4px; }
.zoom button { min-width: 30px; height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; font-size: 17px; line-height: 1; }
.zoom button.zr { font-size: 12.5px; font-weight: 600; }
.zoom button:disabled { opacity: .4; cursor: default; }
.zoom button:not(:disabled):hover { border-color: var(--accent); color: var(--ink); }
details.how { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
details.how > summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
details.how p { color: var(--ink-2); font-size: 13.5px; max-width: 70ch; }
ul.wts { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }

<script>
(() => {

/* ================= aggregates ================= */
const gameScore = l => l.gl + 0.7 * l.a + 0.1 * l.sog + 0.05 * (l.hits + l.blk) + 0.15 * l.pm;

/* ================= player score ================= */

const WEIGHTS = {

  { k: "gl", h: "G", title: "Goals" }, { k: "a", h: "A", title: "Assists" }, { k: "p", h: "P", title: "Points" },
  { k: "sog", h: "SOG", title: "Shots on goal" }, { k: "att", h: "ATT", title: "Shot attempts, including missed and blocked" },

  { k: "tk", h: "TK", title: "Takeaways" }, { k: "gv", h: "GV", title: "Giveaways (fewer is better)", inv: true },
  { k: "toi", h: "TOI", title: "Ice time", fmt: toi, dfmt: v => toi(Math.abs(v)), afmt: toi },

const GSTATS = { F: {}, D: {} };
(function buildScores() {
  const blank = () => ({ att: 0, slot: 0, a1: 0, a2: 0 });
  const extra = new Map();
  const get = k => { if (!extra.has(k)) extra.set(k, blank()); return extra.get(k); };
  G.forEach(g => {
    g.shots.forEach(s => { if (!s[1] || !s[5]) return; const e = get(g.id + ":" + s[5]); e.att++; if (s[2] !== 3 && s[3] != null && inSlot(s[3], s[4], true)) e.slot++; });

  });
  const all = { F: [], D: [] };
  Object.values(skaters).forEach(s => {
    s.grp = s.pos === "D" ? "D" : "F";
    s.log.forEach(l => {
      Object.assign(l, extra.get(l.g.id + ":" + s.pid) || blank());

function statDelta(v, avg, sd, c) {

      if (!href) return "";

      const blocks = [...css.matchAll(/\/\*\s*([\w-]+)\s*\*\/\s*(@font-face\s*\{[^}]*\})/g)].filter(m => m[1] === "latin" || m[1] === "latin-ext").map(m => m[2]);

}

}

  q(".share-bd").addEventListener("click", e => { if (e.target.classList.contains("share-bd")) close(); });
  q("[data-kinds]").onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.k !== k) { k = b.dataset.k; draw(); } };
  q("[data-themes]").onclick = e => { const b = e.target.closest("button"); if (!b || b.dataset.t === theme) return; theme = b.dataset.t; try { localStorage.setItem("cardTheme", theme); } catch (err) { /* ignore */ } draw(); };
  q('[data-a="share"]').onclick = () => {
    if (!blob) return;
    const link = M.siteUrl || (/^https?:$/.test(location.protocol) ? location.href.split("#")[0] : "");
    navigator.share({ files: [fileOf()], title: cur().text, text: link ? `${cur().text} ${link}` : cur().text })
      .catch(e => { if (e && e.name !== "AbortError") status("Couldn't open the share menu. Try Download instead."); });
  };
  q('[data-a="copy"]').onclick = () => {
    if (!blob) return;
    navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
      .then(() => status("Copied. Paste it into your post."), () => status("This browser wouldn't copy the image. Try Download instead."));
  };
  q('[data-a="download"]').onclick = () => {
    if (!blob) return;
    const a = document.createElement("a"); a.href = url; a.download = cur().file; document.body.appendChild(a); a.click(); a.remove();
    status("Saved as " + cur().file);
  };
  shareUi = { close };
  draw();
  q("[data-x]").focus();
}

/* ================= boot ================= */
const TTb = teamTrend();
$("#team-name").textContent = NAME;
$("#season").textContent = M.seasonLabel;
$("#rec").textContent = G.length ? `${TTb.w}-${TTb.l}-${TTb.o}` : "";
if (M.sample) { const b = $("#banner"); b.hidden = false; b.textContent = "Sample data for preview: player names are real, every number and story is made up."; }
$("#footer").innerHTML = `<span>Data: NHL.com public API</span><span>Updated ${esc(M.built)}</span>${M.credit ? `<span>${esc(M.credit)}</span>` : ""}`;
let lastW = window.innerWidth;
window.addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => {
  if (Math.abs(window.innerWidth - lastW) < 8) return; lastW = window.innerWidth; render(); sheet && sheet.draw(); }, 150); });
render();
})();
</script>
